name: Riccati Lean build

on:
  push:
    paths: ['riccati-stability/lean/**', '.github/workflows/riccati-lean.yml']
  pull_request:
    paths: ['riccati-stability/lean/**', '.github/workflows/riccati-lean.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generates lake-manifest.json on the first run, before it is committed.
      - name: Generate lake-manifest.json if missing
        working-directory: riccati-stability/lean
        run: |
          if [ ! -f lake-manifest.json ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
            "$HOME/.elan/bin/lake" update
          fi

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: riccati-stability/lean

      - name: Check axioms
        working-directory: riccati-stability/lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq "$(grep -c '^#print axioms' AxiomCheck.lean)"
          if grep -q sorryAx axioms.txt; then
            echo "A result depends on sorryAx"; exit 1
          fi
          if grep -v 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.txt | grep -q 'depends on axioms'; then
            echo "A result uses a nonstandard axiom"; exit 1
          fi
          n=$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.txt)
          echo "::notice title=Axiom check::$n of $(grep -c '^#print axioms' AxiomCheck.lean) results depend only on propext, Classical.choice, Quot.sound"
          { echo '## Axiom check'; echo '```'; cat axioms.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit lake-manifest.json if it was generated
        working-directory: riccati-stability/lean
        run: |
          if [ -n "$(git status --porcelain -- lake-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lake-manifest.json
            git commit -m "Add lake-manifest.json generated by CI"
            git push
          fi
